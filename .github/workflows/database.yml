name: Database

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # Starts every Supabase container (Postgres, Auth, Storage, Edge Functions...) with config.toml
      # and applies every migration from scratch: the clean rebuild check.
      - run: supabase start
      - run: supabase db lint --fail-on error
      - run: supabase test db
      # HTTP tests against the running Edge Functions, with the local stack's keys.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=' | sed -e 's/^/SUPABASE_/' -e 's/"//g' >> "$GITHUB_ENV"
      - run: npm run test:gateway
